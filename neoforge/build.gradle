plugins {
	id 'collisioneffects.platform-conventions'
	id 'net.neoforged.moddev.legacyforge' version '2.0.144'
}

version = project.version
group = project.group

// Must match the actual runtime JVM (Java 17) used by real NeoForge 1.20.1 clients,
// otherwise Mixin-transformed vanilla classes fail to load with UnsupportedClassVersionError.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.resources {
	srcDir '../common/src/main/resources'
}

sourceSets.main.java {
	srcDir '../common/src/main/java'
	srcDir '../common/src/client/java'
}

// NeoForge did not exist as its own toolchain until Minecraft 1.20.2, so 1.20.1 support is
// published as a legacy fork of Forge (net.neoforged:forge) built with the legacyforge plugin.
legacyForge {
	enable {
		neoForgeVersion = "${project.minecraft_version}-${project.neoforge_version}"
	}

	runs {
		configureEach {
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			// Mixin only reads configs from the jar manifest, so the dev run needs this passed explicitly.
			programArguments.addAll '--mixin.config', 'collision-effects.mixins.json'
		}

		client {
			client()
		}

		server {
			server()
			programArguments.add '--nogui'
		}
	}

	mods {
		"collision_effects" {
			sourceSet sourceSets.main
		}
	}
}

repositories {
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases/'
	}
	mavenCentral()
}

tasks.named('jar', Jar) {
	manifest {
		attributes['MixinConfigs'] = 'collision-effects.mixins.json'
	}
}

processResources {
	inputs.property 'version', project.version
	from('../common/src/main/resources/assets/collision-effects/icon.png') {
		into '.'
	}

	filesMatching('META-INF/mods.toml') {
		expand 'version': inputs.properties.version
	}
}
