plugins {
	id 'collisioneffects.platform-conventions'
	id 'net.neoforged.gradle.userdev' version '7.0.116'
}

version = project.version
group = project.group

// Must match the actual runtime JVM (Java 17) used by real NeoForge 1.20.2 clients,
// otherwise Mixin-transformed vanilla classes fail to load with UnsupportedClassVersionError.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.resources {
	srcDir '../common/src/main/resources'
}

sourceSets.main.java {
	srcDir '../common/src/main/java'
	srcDir '../common/src/client/java'
}

// Minecraft 1.20.2 is the first version NeoForge published as its own standalone
// toolchain (net.neoforged:neoforge), built with NeoGradle rather than the legacy
// Forge-compatibility plugin used for 1.20.1.
runs {
	configureEach {
		workingDirectory project.file('run')
		systemProperty 'forge.logging.markers', 'REGISTRIES'
		// Mixin only reads configs from the jar manifest, so the dev run needs this passed explicitly.
		programArguments.addAll '--mixin.config', 'collision-effects.mixins.json'
		modSource sourceSets.main
	}

	client {
	}

	server {
		programArgument '--nogui'
	}
}

repositories {
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases/'
	}
	mavenCentral()
}

dependencies {
	implementation "net.neoforged:neoforge:${project.neoforge_version}"
}

tasks.named('jar', Jar) {
	manifest {
		attributes['MixinConfigs'] = 'collision-effects.mixins.json'
	}
}

processResources {
	inputs.property 'version', project.version
	from('../common/src/main/resources/assets/collision-effects/icon.png') {
		into '.'
	}

	filesMatching('META-INF/mods.toml') {
		expand 'version': inputs.properties.version
	}
}
