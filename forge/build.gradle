plugins {
	id 'collisioneffects.platform-conventions'
	id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = project.version
group = project.group

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
	srcDir '../common/src/main/resources'
}

sourceSets.main.java {
	srcDir '../common/src/main/java'
	srcDir '../common/src/client/java'
}

minecraft {
	runs {
		configureEach {
			workingDir = layout.projectDirectory.dir('run')
			systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
			// Mixin only reads configs from the jar manifest, so the dev run needs this passed explicitly.
			args '--mixin.config=collision-effects.mixins.json'
		}

		register('client')

		register('server') {
			args '--nogui'
		}
	}
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	mavenCentral()
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${project.forge_version}")
	annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

tasks.named('jar', Jar) {
	manifest {
		attributes['MixinConfigs'] = 'collision-effects.mixins.json'
	}
}

processResources {
	inputs.property 'version', project.version
	from('../common/src/main/resources/assets/collision-effects/icon.png') {
		into '.'
	}

	filesMatching('META-INF/mods.toml') {
		expand 'version': inputs.properties.version
	}
}