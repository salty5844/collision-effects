plugins {
	id 'collisioneffects.platform-conventions'
	id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = project.version
group = project.group

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.resources {
	srcDir '../common/src/main/resources'
}

sourceSets.main.java {
	srcDir '../common/src/main/java'
	srcDir '../common/src/client/java'
}

minecraft {
	mappings channel: 'official', version: '1.20'

	runs {
		configureEach {
			workingDirectory project.file('run')
			property 'eventbus.api.strictRuntimeChecks', 'true'
			// Mixin only reads configs from the jar manifest, so the dev run needs this passed explicitly.
			args '--mixin.config=collision-effects.mixins.json'
		}

		client {
			workingDirectory project.file('run')
		}

		server {
			workingDirectory project.file('run')
			args '--nogui'
		}
	}
}

repositories {
	maven {
		name = 'Forge'
		url = 'https://maven.minecraftforge.net/'
	}
	mavenCentral()
}

dependencies {
	minecraft "net.minecraftforge:forge:${project.forge_version}"
}

tasks.named('jar', Jar) {
	manifest {
		attributes['MixinConfigs'] = 'collision-effects.mixins.json'
	}
}

processResources {
	inputs.property 'version', project.version
	from('../common/src/main/resources/assets/collision-effects/icon.png') {
		into '.'
	}

	filesMatching('META-INF/mods.toml') {
		expand 'version': inputs.properties.version
	}
}